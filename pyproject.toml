[project]
name = "bg2cellml"
description = "Bondgraph RDF tools"
version = "0.12.0"
authors = [
    { name = "David Brooks", email = "d.brooks@auckland.ac.nz"}
]
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "lxml>=6.1.3",
    "networkx>=3.7",
    "pint>=0.25.3,<0.26",
    "sympy>=1.14.0",
    "pyoxigraph>=0.5.13",
    "ucumvert>=0.3.2",
    "sigfig>=1.4.0",
]

[dependency-groups]
dev = [
    "pip>=26.2.2",
    "pyodide-build>=0.39.3",
    "pytest>=9.1.1",
]
notebook = [
    "ipycytoscape>=1.3.3",
    "ipympl>=0.10.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
]
standalone = [
    "libopencor>=1.20261020.0",
    "rich>=15.0.0",
    "structlog>=26.1.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["bg2cellml"]

[tool.hatch.build.targets.sdist.force-include]
"BG-RDF/examples" = "/bg2cellml/BG-RDF/examples"
"BG-RDF/templates" = "/bg2cellml/BG-RDF/templates"
"BG-RDF/schema/ontology.ttl" = "/bg2cellml/BG-RDF/schema/ontology.ttl"

[tool.hatch.build.targets.wheel]
packages = ["bg2cellml"]

[tool.hatch.build.targets.wheel.force-include]
"BG-RDF/examples" = "/bg2cellml/BG-RDF/examples"
"BG-RDF/templates" = "/bg2cellml/BG-RDF/templates"
"BG-RDF/schema/ontology.ttl" = "/bg2cellml/BG-RDF/schema/ontology.ttl"
